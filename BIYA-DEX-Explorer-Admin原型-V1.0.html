case 'confirm-reset':db=seed();save();closeModal();closeDrawer();viewState='normal';filters={};pages={};sorts={};render();toast('已恢复初始异常场景。');break;
}});
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();submitSearch();return}let id=e.target.dataset.filter;if(id){e.preventDefault();filters[id]=Object.fromEntries(new FormData(e.target));pages[id]=1;sorts[id]=undefined;render()}});
$('#globalSearch').addEventListener('input',renderSearch);$('#globalSearch').addEventListener('focus',()=>{if($('#globalSearch').value)renderSearch()});

function applyScenario(healthy){
  db.scenario=healthy?'healthy':'incident';
  db.nodeReachable=true;
  db.nodeAdvancing=healthy;
  db.fixedGap=healthy;
  db.nodeHeight=CHAIN;
  db.nodeRound=healthy?5021900:5021840;
  db.lastBlockTime=healthy?'2026-10-16 14:32:48':'2026-10-16 14:02:48';
  save();viewState='normal';render();closeDrawer();
  toast(healthy?'已切换数据正常场景。主结论看当前巡检；告警状态保持原值，不自动结案、不发恢复 Lark。':'已切换异常待处理场景。告警状态保持原值。');
}
function runDemoScene(id){
  if(id==='nav-overview'){navigation('overview');return}
  if(id==='nav-alerts'){navigation('alerts');return}
  if(id==='scene-incident'){applyScenario(false);return}
  if(id==='scene-healthy'){applyScenario(true);return}
  if(id==='view-normal'||id==='view-loading'||id==='view-empty'||id==='view-error'||id==='view-session'){viewState=id.slice(5);closeDrawer();closeModal();render();toast('页面状态：'+({normal:'正常展示',loading:'加载中',empty:'空数据',error:'网络错误',session:'会话失效'}[viewState]));return}
  if(id==='alert-unreachable'||id==='alert-stall'||id==='alert-gap'){
    let map={'alert-unreachable':'ALT-1001','alert-stall':'ALT-1002','alert-gap':'ALT-1003'};
    if(db.scenario!=='incident')applyScenario(false);
    navigation('alerts');
    setTimeout(()=>openAlert(map[id]),0);
    return;
  }
  if(id==='lark-ok'){db.larkSend='ok';save();toast('后续 Lark 记录将标记为发送成功。');syncDemoGuideActive();return}
  if(id==='lark-fail'){db.larkSend='fail';save();toast('后续 Lark 记录将标记为发送失败。');syncDemoGuideActive();return}
  if(id==='reset-demo'){openModal('重置原型演示',`<p>清除本原型的告警备注与 Lark 记录，恢复初始异常场景。</p><p class="note">只重置此 HTML 在浏览器内保存的演示数据。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-reset">恢复初始数据</button>`);return}
}
function syncDemoGuideActive(){
  let panel=$('#demoGuidePanel');if(!panel)return;
  let active={
    'nav-overview':currentPage==='overview',
    'nav-alerts':currentPage==='alerts',
    'scene-incident':db.scenario==='incident',
    'scene-healthy':db.scenario==='healthy',
    'view-normal':viewState==='normal',
    'view-loading':viewState==='loading',
    'view-empty':viewState==='empty',
    'view-error':viewState==='error',
    'view-session':viewState==='session',
    'lark-ok':db.larkSend==='ok',
    'lark-fail':db.larkSend==='fail'
  };
  panel.querySelectorAll('.demo-kw').forEach(el=>{
    let id=el.getAttribute('data-demo');
    el.classList.toggle('active',!!active[id]);
  });
}
(function initDemoGuidePanel(){
  const toggle=$('#demoGuideToggle'), panel=$('#demoGuidePanel'), closeBtn=$('#demoGuideClose');
  if(!toggle||!panel||!closeBtn)return;
  const head=panel.querySelector('.demo-guide-head');
  function openPanel(){panel.classList.add('open');panel.setAttribute('aria-hidden','false');syncDemoGuideActive()}
  function closePanel(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true')}
  toggle.addEventListener('click',()=>{panel.classList.contains('open')?closePanel():openPanel()});
  closeBtn.addEventListener('click',closePanel);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open'))closePanel()});
  let dragging=false,startX=0,startY=0,originLeft=0,originTop=0;
  head.addEventListener('mousedown',e=>{
    if(e.target.closest('.demo-guide-close'))return;
    dragging=true;const rect=panel.getBoundingClientRect();startX=e.clientX;startY=e.clientY;originLeft=rect.left;originTop=rect.top;
    panel.style.right='auto';panel.style.left=originLeft+'px';panel.style.top=originTop+'px';panel.style.transition='none';
    document.body.style.userSelect='none';e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    let nx=Math.max(8,Math.min(window.innerWidth-panel.offsetWidth-8,originLeft+(e.clientX-startX)));
    let ny=Math.max(8,Math.min(window.innerHeight-60,originTop+(e.clientY-startY)));
    panel.style.left=nx+'px';panel.style.top=ny+'px';
  });
  document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;panel.style.transition='';document.body.style.userSelect=''});
  panel.addEventListener('click',e=>{
    const chip=e.target.closest('.demo-kw');if(!chip)return;
    const sceneId=chip.getAttribute('data-demo');if(!sceneId)return;
    runDemoScene(sceneId);syncDemoGuideActive();
    if(window.innerWidth<800)closePanel();
  });
})();

document.addEventListener('click',e=>{if(!e.target.closest('.global-search'))$('#searchResults').hidden=true});
$('#drawerOverlay').addEventListener('click',e=>{if(e.target===$('#drawerOverlay'))closeDrawer()});$('#modalOverlay').addEventListener('click',e=>{if(e.target===$('#modalOverlay'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalOverlay').classList.contains('open'))closeModal();else if($('#drawerOverlay').classList.contains('open'))closeDrawer();$('#searchResults').hidden=true}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Tab'){let scope=$('#modalOverlay').classList.contains('open')?$('.modal'):$('#drawerOverlay').classList.contains('open')?$('.drawer'):null;if(scope){let els=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]',scope).filter(x=>x.offsetParent!==null);if(!els.length)return;let first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
$('#searchIcon').innerHTML=icon('search');
save();renderRoute();
</script>
