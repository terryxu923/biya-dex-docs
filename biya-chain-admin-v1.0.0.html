function csvRows(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('CSV 引号未闭合');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}

 if(route!==state.route){Object.assign(state,queryDefaults);state.gasNode=OBS.primaryObserver&&hasPermission('read',OBS.primaryObserver)?OBS.primaryObserver:'';resetPages();}
 const hash=writeLocation(route,node,focus,extra);if(location.hash===hash)syncRoute();else location.hash=hash;
};
const queryDefaults={tab:'',query:'',storageType:'Replica',gasNode:'val-01',gasType:'all',failureName:'',alertType:'all',alertQuery:'',logStart:'',logEnd:''};
const legalValues={tab:['all','validator','follow'],storageType:['Replica','checkpoint','sidecar','snapshot'],gasType:['all','small','big']};
syncRoute=()=>{
 let [route,query]=location.hash.slice(1).split('?');const params=new URLSearchParams(query||'');let focus=params.get('focus')||'';
 const oldClock=route==='infra'||(route==='overview'&&focus==='clock');
 if(oldClock){route='overview';focus='';}
 route=({status:'overview',perf:'chain',trends:'chain',governance:'overview'})[route]||route||'overview';
 if(!TITLES[route])route='overview';const changed=route!==state.route;if(changed)resetPages();state.route=route;state.blocked='';state.routeNotice='';
 state.window=['1h','6h','24h'].includes(params.get('window'))?params.get('window'):state.window;
 const end=Number(params.get('at'));state.cutoff=params.has('at')&&Number.isFinite(end)&&end>0&&end<=Date.now()+1000?end:Date.now();state.fixedCutoff=Date.now()-state.cutoff>windowMs()/2;
 for(const key of QUERY_KEYS){if(params.has(key)){const v=params.get(key);state[key]=!legalValues[key]||legalValues[key].includes(v)?v:queryDefaults[key];}else if(changed||route==='logs'&&ROUTE_QUERY.logs.includes(key)||route==='nodes'&&ROUTE_QUERY.nodes.includes(key))state[key]=queryDefaults[key];}
 state.node=params.get('node')||'all';state.focus=focus;
 if(!hasPermission('read'))state.blocked='无访问权限';
 else if(state.node!=='all'){
  if(!nodeBy(state.node))state.blocked='节点不存在或已移除';
  else if(!hasPermission('read',state.node))state.blocked='无权查看该节点';
  else if(route==='nodes'&&nodeBy(state.node).role==='gateway'){
   state.blocked='此入口服务请在 Ex_API 交易池查看';
  }
  else if(!scopeNodes().some(n=>n.id===state.node))state.blocked='该节点不适用于当前页面';
 }
 if(state.gasNode&&(!nodeBy(state.gasNode)||!hasPermission('read',state.gasNode)||nodeBy(state.gasNode).role==='gateway')){state.gasNode='';state.routeNotice='请选择有权查看的 EVM 观测节点';}
 if(oldClock)state.routeNotice='时钟同步区域已移除';
 if(focus&&!({chain:['chain-indicators','chain-comparison'],ingress:['gas']}[route]||[]).includes(focus)){state.routeNotice='定位区域不存在';state.focus='';}
 closeAllModals();render();document.getElementById('sidebar').classList.remove('open');
 if(state.focus&&focus)setTimeout(()=>document.getElementById(focus)?.scrollIntoView({block:'start'}),0);
 if(params.has('alert')&&!state.blocked)openAlert(params.get('alert'));
};

function heightResult(n){
 const sample=chainHead(n),base=heightReference();
 if(!availableSample(sample)||!heightValue(sample.height))return {sample,note:'节点高度缺测或过期'};
 if(!availableSample(base)||!heightValue(base.height)||base.chainId!==sample.chainId||base.stage!==sample.stage||base.nodeId===n.id&&state.node!=='all')return {sample,note:'缺少同口径的有效参考高度'};
 if(sample.height>base.height)return {sample,note:'节点高度高于参考值，请核查基准'};

function chainComparison(nodes){
 const base=OBS.chainBaseline,comparable=r=>base&&availableSample(r)&&r.t<=state.cutoff&&r.chainId===base.chainId&&r.version===base.version&&r.stage===base.stage&&heightValue(r.height)&&/^0x[\da-f]{64}$/i.test(r.digest);
 const samples=OBS.chainHistory.filter(comparable);
 const eligible=nodes.filter(n=>samples.some(r=>r.nodeId===n.id));
 const heights=samples.filter(r=>r.nodeId===base?.nodeId&&eligible.every(n=>samples.some(s=>s.nodeId===n.id&&s.height===r.height))).map(r=>r.height);
 const height=heights.length?Math.max(...heights):null;
 const reference=latestNodeSample(samples.filter(r=>r.height===height),base?.nodeId);
 const rows=nodes.map(node=>{
  const sample=latestNodeSample(samples.filter(r=>r.height===height),node.id);
  const valid=!!(sample&&reference&&!(eligible.length===1&&reference.nodeId===node.id));
  return {node,sample,valid,mismatch:valid&&sample.digest.toLowerCase()!==reference.digest.toLowerCase()};
 });
 const valid=rows.filter(r=>r.valid).length;
 return {height,rows,valid,mismatches:rows.filter(r=>r.mismatch)};
}
function chainSample(n){

 return {lag:valid&&heightValue(r.executableFinalHeight)&&heightValue(r.completedHeight)&&r.executableFinalHeight>=r.completedHeight?r.executableFinalHeight-r.completedHeight:null,mempool:valid&&heightValue(r.mempool)?r.mempool:null,completed:valid&&heightValue(r.completedHeight)?r.completedHeight:null};
}
function validatorSpread(nodes){

buckets=(rows,getValue,last=false)=>{
 const step=bucketMs(),start=state.cutoff-windowMs(),map=new Map();
 for(const r of rows){if(!inWindow(r.t))continue;const t=Math.min(state.cutoff,start+Math.ceil((r.t-start)/step)*step);if(!map.has(t))map.set(t,[]);map.get(t).push(r);}

};

ingressRows=()=>noSample()?[]:OBS.ingress.filter(r=>hasPermission('read',r.nodeId)&&inWindow(r.receivedAt)&&(state.node==='all'||r.nodeId===state.node)).filter((r,i,a)=>a.findIndex(x=>x.nodeId===r.nodeId&&x.id===r.id)===i).sort((a,b)=>b.receivedAt-a.receivedAt||cmp(a.nodeId,b.nodeId)||cmp(a.id,b.id));
const validEventTime=(r,field)=>Number.isFinite(r[field])&&r[field]>=r.receivedAt&&r[field]<=state.cutoff;
const eventDuration=(r,field)=>validEventTime(r,field)&&(field!=='confirmedAt'||validEventTime(r,'broadcastAt')&&r.confirmedAt>=r.broadcastAt)&&r.timeQuality==='ok'&&!(state.scenario==='alert'&&r.validatorId==='val-03')?r[field]-r.receivedAt:null;
function ingressMetrics(){
 const rows=ingressRows(),bundles=new Map();
 for(const r of OBS.ingress){if(!r.bundle||!hasPermission('read',r.nodeId)||(state.node!=='all'&&r.nodeId!==state.node))continue;const k=r.nodeId+'/'+r.bundle;if(!bundles.has(k))bundles.set(k,[]);bundles.get(k).push(r);}
 const broadcasted=[...bundles.values()].filter(rs=>{const ts=rs.filter(r=>validEventTime(r,'broadcastAt')).map(r=>r.broadcastAt);return ts.length&&inWindow(Math.min(...ts));});
 return {broadcast:p95(rows.map(r=>eventDuration(r,'broadcastAt'))),finality:p95(rows.map(r=>eventDuration(r,'confirmedAt'))),mean:broadcasted.length?broadcasted.reduce((s,rs)=>s+new Set(rs.map(r=>r.businessId)).size,0)/broadcasted.length:null};
};
const gasInteger=v=>{try{if(typeof v==='number'&&!Number.isSafeInteger(v))return null;return /^\d+$/.test(String(v))?BigInt(v):null;}catch{return null;}};
const validGas=b=>{const used=gasInteger(b.gasUsed),limit=gasInteger(b.gasLimit);return used!==null&&limit!==null&&limit>0n&&used<=limit;};
const gasRatio=(used,limit)=>Number((used*100000000n+limit/2n)/limit)/1000000;
dedupBlocks=rows=>[...new Map(rows.map(b=>[(b.chainId||'')+':'+b.number+':'+b.hash,b])).values()];
blockRows=()=>{
 if(noSample()||!hasPermission('read',state.gasNode))return [];
 const rows=dedupBlocks(OBS.blocks.filter(b=>b.observerNodeId===state.gasNode&&inWindow(b.t))),byHeight=new Map();
 for(const r of rows){const k=r.chainId+'/'+r.number;if(!byHeight.has(k))byHeight.set(k,[]);byHeight.get(k).push(r);}
 return [...byHeight.values()].flatMap(rs=>rs.length===1?rs:rs.filter(r=>r.canonical===true&&rs.filter(x=>x.canonical===true).length===1)).map(b=>({...b,blockType:b.typeSource&&['small','big'].includes(b.blockType)?b.blockType:'unknown'})).sort((a,b)=>b.t-a.t||b.number-a.number||cmp(a.hash,b.hash));
};

 return {count:bs.length,valid:valid.length,invalid:bs.length-valid.length,ratio:limit?gasRatio(used,limit):null,gas:used,max:valid.length?Math.max(...valid.map(b=>gasRatio(gasInteger(b.gasUsed),gasInteger(b.gasLimit)))):null,last:valid.length?Math.max(...valid.map(b=>b.t)):null};
};
const classifyFailure=r=>{

evmReceipts=()=>{
 if(isQualityBad())return [];
 const selected=scopedNodes().map(n=>n.id),map=new Map();
 for(const original of OBS.receipts){const normalized=original.status===0||original.status==='0x0'?0:original.status===1||original.status==='0x1'?1:null;const r={...original,status:normalized};if(!inWindow(r.t)||normalized==null||!r.hash||!r.blockHash||!Number.isSafeInteger(r.blockNumber)||r.quality!=='ok')continue;const observers=(r.observerNodeIds||[r.observerNodeId]).filter(n=>selected.includes(n)&&hasPermission('read',n));if(!observers.length)continue;
  const key=(r.chainId||'')+'/'+r.blockHash+'/'+r.hash,prev=map.get(key);
  if(prev){if(prev.status!==r.status){prev.conflict=true;continue;}prev.observerNodeIds=[...new Set([...prev.observerNodeIds,...observers])];}
  else map.set(key,{...r,observerNodeIds:observers,reasonCategory:r.status===0?classifyFailure(r):'',reasonText:r.reasonEvidence?.kind==='decoded'?r.reasonEvidence.text:r.reasonText==='—'?null:r.reasonText});
 }
 const rows=[...map.values()];return rows.filter(r=>!r.conflict&&!rows.some(x=>x.chainId===r.chainId&&x.hash===r.hash&&x.blockHash!==r.blockHash));
};

 for(const r of OBS.ingress){
  if(!ids.has(r.nodeId)||!r.id||!r.eventSource||r.timeQuality!=='ok'||!Number.isFinite(r.receivedAt))continue;

const logInputValue=t=>t?new Date(t+8*hourMs).toISOString().slice(0,16):'';
const parseLogInput=value=>value?Date.parse(value+'+08:00'):NaN;
function logRange(){
 const timestamp=(value,fallback)=>Number.isSafeInteger(Number(value))&&Number(value)>0&&Number(value)<=8.64e15-8*hourMs?Number(value):fallback;
 return {start:timestamp(state.logStart,state.cutoff-hourMs),end:timestamp(state.logEnd,state.cutoff)};
}
const logEncoder=new TextEncoder();
const supportedLogNodes=()=>scopeNodes().filter(n=>n.logSupported!==false);
const canDownloadLog=node=>hasPermission('read',node)&&hasPermission('export',node)&&!OBS.logDownloadDenied?.includes(node);
function logPackages(){
 if(noSample()||state.scenario==='error')return [];
 const {start,end}=logRange(),groups=new Map(),policy=OBS.logPolicy;
 if(end<=start||end-start>policy.maxQueryMs)return [];
 const ids=new Set(supportedLogNodes().filter(n=>(state.node==='all'||state.node===n.id)&&!OBS.logFailedNodes?.includes(n.id)).map(n=>n.id));
 for(const r of OBS.logs){
  if(!ids.has(r.nodeId)||r.t>state.cutoff)continue;
  const from=Math.floor(r.t/hourMs)*hourMs,to=from+hourMs;
  if(from>=end||to<=start||to>state.cutoff||to<=state.cutoff-policy.retentionMs)continue;
  const key=JSON.stringify([r.nodeId,from]);
  if(!groups.has(key))groups.set(key,{node:r.nodeId,from,to,rows:[]});
  groups.get(key).rows.push(r);
 }
 return [...groups.values()].sort((a,b)=>b.from-a.from||cmp(a.node,b.node)).flatMap(({node,from,to,rows})=>{
  const text=rows.sort((a,b)=>a.t-b.t||cmp(a.id,b.id)).map(r=>`${timeText(r.t)} UTC+8 [${r.level}] ${r.message}\n`).join('');
  const parts=[];let part='',bytes=0;
  for(const symbol of text){
   const size=logEncoder.encode(symbol).length;
   if(bytes+size>policy.maxBytes){parts.push({text:part,bytes});part='';bytes=0;}
   part+=symbol;bytes+=size;
  }
  if(bytes)parts.push({text:part,bytes});
  return parts.map((payload,i)=>({id:`${node}-${from}-${i+1}`,node,from,to,part:i+1,total:parts.length,payload,name:`${node}-${logInputValue(from).replace(/[:T]/g,'-')}-${i+1}.log`}));
 });
}

  esc(nodeBy(pkg.node)?.name||pkg.node),timeText(pkg.from)+' 至 '+timeText(pkg.to),esc(pkg.name),fmt(pkg.payload.bytes)+' B',pkg.part+' / '+pkg.total,canDownloadLog(pkg.node)?button('下载','log-download',`data-id="${esc(pkg.id)}"`,'link'):button('下载','log-download','title="无下载权限"','link',true)+'<span class="muted">无下载权限</span>'

function downloadLog(id){

    if(scene==='gas-unknown')OBS.blocks.forEach(b=>b.typeSource=null);
    if(scene==='gas-select')state.gasNode='';
    if(['gas-small','gas-big'].includes(scene))state.gasType=scene.slice(4);
    break;
   case 'evm':
    if(['fail-types','reason-missing'].includes(scene)){
     const seed=OBS.receipts.find(r=>r.status===0||r.status==='0x0');
     const label={name:'转账',source:'本地业务标签样例'},label2={name:'兑换',source:'本地业务标签样例'};
     const fixtures=[['out-of-gas',label],['revert',label],['decoded',label2],[null,null]];
     OBS.receipts=fixtures.map(([kind,businessLabel],i)=>({...seed,hash:'0x'+String(i+1).padStart(64,'0'),t:OBS.anchor-(i+1)*60000,businessLabel,reasonEvidence:kind?{kind,source:'本地执行样本',text:'执行失败'}:null}));
     if(scene==='reason-missing')OBS.receipts=OBS.receipts.slice(-1);
    }
    if(scene==='no-executions')OBS.receipts=[];
    if(scene==='success-only')OBS.receipts=OBS.receipts.filter(r=>r.status===1||r.status==='0x1');
    break;
   case 'alerts':
    if(scene!=='normal'&&!['loading','empty','error','stale','partial','denied','no-match'].includes(scene)){
     alarmRecords.length=0;notifications.length=0;
     const t=OBS.anchor-300000;
     if(scene==='resend')OBS.alertRules={'chain-state':{allowResend:true,minIntervalMs:120000,condition:event=>event.testResend===true}};
     if(scene.startsWith('notification-')||scene==='resend'||scene==='repeat')OBS.notificationConfig={target:'本地测试群',maxAttempts:scene==='notification-retry'?2:1,retryDelays:[50]};
     if(['notification-success','notification-failure','notification-retry','resend','repeat'].includes(scene))OBS.notificationAdapter=async ({attempt})=>{
      if(scene==='notification-failure'||scene==='notification-retry'&&attempt===1)return {code:1,message:'模拟投递超时',retryable:scene==='notification-retry'};
      return {code:0,messageId:'local-fixture-'+attempt};
     };
     const a=demoAlert(t);
     if(scene==='repeat'||scene==='resend'){
      demoAlert(t+60000,{testResend:true});demoAlert(t+120000,{testResend:true});demoAlert(t+120000,{testResend:true});demoAlert(t);
     }
     if(scene==='notification-retry')await new Promise(resolve=>setTimeout(resolve,100));
     if(scene!=='repeat'&&scene!=='resend')after=()=>openAlert(a.id);
    }
    break;
   case 'logs':
    if(!['normal','empty','loading','error','stale','partial','denied'].includes(scene))demoLogRange();
    if(scene==='all-nodes'){
     OBS.logs.push(...OBS.logs.map(r=>({...r,id:r.id+'-second',nodeId:'val-02'})),...OBS.logs.map(r=>({...r,id:r.id+'-hidden',nodeId:'val-03'})));
     USER.nodeIds=['val-01','val-02'];OBS.logDownloadDenied=['val-02'];state.node='all';
    }
    if(scene==='partial')OBS.logFailedNodes=['val-02'];
    if(scene==='no-match')state.node='val-02';
    if(scene==='download-denied')USER.permissions=['monitor:read'];
    if(scene==='download-expired')state.logFileState='expired';
    if(scene==='download-retry')state.logFileState='retry';
    if(scene==='span-limit')state.logStart=state.logEnd-2*24*hourMs;
    break;
  }

  history.replaceState(null,'',writeLocation(route,state.node,state.focus));render();after?.();updatePanel();
  if(document.querySelector('.dialog')&&demo.open)toggle(false);
  if(state.focus)document.getElementById(state.focus)?.scrollIntoView({block:'start'});else scrollTo(0,0);
 }
 function recover(){
  const current=clone(state),was=demo.scene,route=state.route;
  run(route,'normal');Object.assign(state,Object.fromEntries([...QUERY_KEYS,'window','node','focus'].map(k=>[k,current[k]])));state.pagers=current.pagers;state.cutoff=Date.now();history.replaceState(null,'',writeLocation(route,state.node,state.focus));render();
  if(was==='audit-error')handleAction('audit',{dataset:{}});
 }
 const productRender=render;
 render=()=>{productRender();decorate();updatePanel();};
 function decorate(){
  if(!demo.active||state.route!==demo.route||state.blocked)return;
  const workspace=document.getElementById('workspace'),scene=demo.scene;
  if(['loading','error'].includes(scene)){
   workspace.querySelectorAll('.metric-value').forEach(e=>{e.textContent=scene==='loading'?'正在加载…':'—';e.classList.add('demo-loading-value');});
   workspace.querySelectorAll('.panel').forEach(p=>{const title=p.querySelector('.panel-head').outerHTML;p.innerHTML=title+(scene==='loading'?'<div class="demo-skeleton" aria-label="正在加载"><i></i><i></i><i></i></div>':htmlNotice('读取失败，请重试',true));});
  }
  if(scene==='stale'&&!workspace.textContent.includes('最后成功采样'))workspace.insertAdjacentHTML('afterbegin',hint('数据过期 · 最后成功采样 '+timeText(OBS.anchor)+' · UTC+8','amber'));
  if(scene==='partial'){
   const m=Object.values(OBS.moduleStatus).find(m=>m.status==='partial');
   if(m)workspace.insertAdjacentHTML('afterbegin',hint('数据不完整 · 有效 '+m.valid+' / '+m.expected+' · 缺失部分不计为正常','amber'));
  }
 }
 // Capture only explicit demo controls; ordinary application controls keep their behavior.
 document.addEventListener('click',e=>{
  const button=e.target.closest('[data-demo-case],[data-demo-reset],[data-demo-close],[data-demo-recover]');
  if(!button)return;e.preventDefault();e.stopImmediatePropagation();
  if(button.hasAttribute('data-demo-reset')){reset();return;}
  if(button.hasAttribute('data-demo-close')){toggle(false);return;}
  if(button.hasAttribute('data-demo-recover')){recover();return;}
  run(button.dataset.demoRoute,button.dataset.demoCase);
 },true);
 const productAction=handleAction;
 handleAction=(action,el)=>{
  if(demo.active&&state.route===demo.route){
   if((action==='refresh'||action==='module-retry')&&['loading','error','stale','partial','storage-partial'].includes(demo.scene)){recover();return;}
   if(action==='modal-save'&&demo.scene==='edit-failure'&&document.querySelector('#form-error')?.textContent){state.saveFailure=false;}
  }
  return productAction(action,el);
 };
 trigger.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return;}toggle(!demo.open);});
 root.addEventListener('pointerdown',e=>{
  if(e.button!==0||!(e.target===trigger||e.target.closest('.demo-toolbar')&&!e.target.closest('button')))return;
  const r=trigger.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:r.left,top:r.top,moved:false,fromTrigger:e.target===trigger};e.target.setPointerCapture(e.pointerId);
 });
 root.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;drag.moved=true;root.classList.add('is-dragging');
  root.style.right='auto';root.style.bottom='auto';root.style.left=Math.max(8,Math.min(drag.left+dx,innerWidth-trigger.offsetWidth-8))+'px';root.style.top=Math.max(8,Math.min(drag.top+dy,innerHeight-trigger.offsetHeight-8))+'px';if(demo.open)placePanel();
 });
 const endDrag=()=>{if(drag?.moved&&drag.fromTrigger)suppressClick=true;drag=null;root.classList.remove('is-dragging');};root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&demo.open){e.preventDefault();e.stopImmediatePropagation();toggle(false);return;}
  if(e.key==='Tab'&&demo.open&&root.contains(document.activeElement)){const items=[...root.querySelectorAll('button:not(:disabled)')].filter(e=>e.getClientRects().length),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}e.stopImmediatePropagation();}
 },true);
 window.addEventListener('resize',()=>{if(root.style.left){root.style.left=Math.max(8,Math.min(parseFloat(root.style.left),innerWidth-trigger.offsetWidth-8))+'px';root.style.top=Math.max(8,Math.min(parseFloat(root.style.top),innerHeight-trigger.offsetHeight-8))+'px';}if(demo.open)placePanel();});
 // Keep fixture data available through linked pages until the user resets the demo.
 Object.assign(demo,{run,reset,recover,cases:CASES,common:COMMON,toggle});updatePanel();
})();
